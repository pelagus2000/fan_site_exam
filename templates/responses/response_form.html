{% extends 'flatpages/default.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Оставить отклик</h2>
    <form method="post" action="{% url 'submit_response' post.id %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="response_text">Ваш отклик:</label>
            <textarea name="response_text" id="response_text" class="form-control mb-3" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Отправить</button>
        <a href="{% url 'post_detail' post.id %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
