{% extends 'flatpages/default.html' %}

{% block content %}
<h2>Login</h2>
<form method="post">
    {% csrf_token %}
    <p>{{ form.username.label_tag }} {{ form.username }}</p>
    <p>{{ form.password.label_tag }} {{ form.password }}</p>
    <button type="submit">Login</button>
</form>
{% if error %} <p style="color:red;">{{ error }}</p> {% endif %}
{% endblock %}
